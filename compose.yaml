services:
  app:
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-8000}:8000"
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Copy .env.example to .env and set DJANGO_SECRET_KEY}"
      DJANGO_DEBUG: "${DJANGO_DEBUG:-0}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      DATA_ROOT: /app/data
      SYNCED_DATA_ROOT: /app/data/synced_data
      SESSION_COOKIE_AGE: "${SESSION_COOKIE_AGE:-15552000}"
      TZ: "${TZ:-Asia/Seoul}"
    volumes:
      - ./data:/app/data
      - /Users/haecho/Library/CloudStorage/OneDrive-주식회사마인드디자인:/app/data/synced_data/onedrive:ro
    read_only: true
    tmpfs:
      - /tmp
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60 --access-logfile - --error-logfile -
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
